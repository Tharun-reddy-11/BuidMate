server.port=${PORT:9292}
spring.application.name=buildmate-backend

# DATABASE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/buildmate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (admin only)
app.jwt-secret=${JWT_SECRET:buildmate-development-secret-key-change-before-production-2026}
app.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin-email=${ADMIN_EMAIL:tharunreddyb30@gmail.com}
app.admin-password=${ADMIN_PASSWORD:Admin@123}

# FRONTEND / CORS (comma-separated when you deploy)
app.frontend-urls=${FRONTEND_URLS:http://localhost:5173,http://127.0.0.1:5173}

# GMAIL SMTP - create a Google App Password and set MAIL_APP_PASSWORD
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tharunreddyb30@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from-name=${MAIL_FROM_NAME:Tharun from BuildMate}

# LOGGING
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
